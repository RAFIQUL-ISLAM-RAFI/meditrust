<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Something went wrong · MediTrust</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;
    display:grid;place-items:center;
    font:400 1rem/1.6 "Hanken Grotesk",system-ui,-apple-system,sans-serif;
    color:#0A1A15;
    background:
      radial-gradient(ellipse 80% 60% at 50% 0%, #16342A 0%, #0A1A15 60%),
      #0A1A15;
    padding:2rem;
  }
  .card{
    background:#fff;
    border:1px solid #E1E8E4;
    border-radius:20px;
    padding:2.5rem 2rem;
    max-width:480px;
    width:100%;
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.3);
  }
  .seal{
    width:96px;height:96px;
    margin:0 auto 1.25rem;
    border-radius:50%;
    border:4px solid #DC2626;
    color:#DC2626;
    display:grid;place-items:center;
    background:#fff;
    box-shadow:0 0 0 8px rgba(255,255,255,.7),0 4px 12px rgba(0,0,0,.08);
    position:relative;
  }
  .seal::after{
    content:"";position:absolute;inset:8px;
    border:2px dashed currentColor;
    border-radius:50%;
    opacity:.5;
  }
  .seal svg{width:42px;height:42px}
  h1{
    font-size:2rem;
    margin:0 0 .75rem;
    letter-spacing:-.02em;
    line-height:1.15;
  }
  p{color:#1F3731;margin:0 0 1.5rem}
  a.btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:.5rem;
    min-height:48px;
    padding:0 1.5rem;
    border-radius:12px;
    background:linear-gradient(180deg,#10A37F 0%,#067656 100%);
    color:#fff;
    text-decoration:none;
    font-weight:600;
    box-shadow:0 4px 12px rgba(6,118,86,.3);
    transition:transform .2s,box-shadow .2s;
  }
  a.btn:hover{
    transform:translateY(-2px);
    box-shadow:0 12px 24px rgba(6,118,86,.4);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="seal" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 6l12 12M18 6L6 18"/>
      </svg>
    </div>
    <h1>Something went wrong</h1>
    <p>We couldn't process your request. Please try again in a moment.</p>
    <a class="btn" href="/">Back to home</a>
  </div>
</body>
</html>
