{% extends "ui/base.html" %}
{% block title %}Action unavailable · MediTrust{% endblock %}
{% block content %}
<section class="card auth wide" style="text-align:center" data-reveal>

  <div class="seal" style="color:var(--bad);width:96px;height:96px">
    <svg aria-hidden="true"><use href="#i-bad"/></svg>
  </div>

  <h1>Action unavailable</h1>
  <p role="alert" style="max-width:52ch;margin:0 auto 1.75rem">{{ error }}</p>

  <div class="actions" style="justify-content:center">
    <a class="btn alt" href="{% url 'ui:dashboard' %}">My dashboard</a>
    <a class="btn" href="{% url 'ui:landing' %}">Home</a>
  </div>

</section>
{% endblock %}
